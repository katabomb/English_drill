<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>英語倒置法ドラッグ練習 100問</title>
  <style>
    :root {
      --bg: #f7f5ef;
      --card: #ffffff;
      --ink: #202124;
      --muted: #6b7280;
      --line: #ded8ca;
      --accent: #445c43;
      --accent2: #d98948;
      --ok: #16803c;
      --bad: #b42318;
      --soft: #f0eadf;
      --chip: #fffaf2;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(217,137,72,0.18), transparent 34rem),
        linear-gradient(135deg, #f8f5ed, #eef2ec);
      color: var(--ink);
      min-height: 100vh;
    }

    header {
      padding: 28px 18px 16px;
      text-align: center;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.5rem, 4vw, 2.4rem);
      letter-spacing: 0.03em;
    }

    .subtitle {
      margin: 0 auto;
      max-width: 760px;
      color: var(--muted);
      line-height: 1.7;
      font-size: 0.98rem;
    }

    main {
      width: min(1050px, calc(100% - 24px));
      margin: 0 auto 48px;
    }

    .panel {
      background: rgba(255,255,255,0.88);
      border: 1px solid rgba(222,216,202,0.9);
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(51,45,33,0.10);
      padding: 18px;
      backdrop-filter: blur(10px);
    }

    .toolbar {
      display: grid;
      grid-template-columns: 1fr auto auto auto;
      gap: 10px;
      align-items: center;
      margin-bottom: 14px;
    }

    .selectWrap, button {
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--ink);
      min-height: 42px;
    }

    select {
      width: 100%;
      border: none;
      background: transparent;
      padding: 0 16px;
      height: 42px;
      font-size: 0.95rem;
      outline: none;
    }

    button {
      padding: 0 16px;
      cursor: pointer;
      font-weight: 700;
      transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 18px rgba(0,0,0,0.08);
    }

    button.primary {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    button.warn {
      background: #fff8ed;
    }

    .progressRow {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      margin-bottom: 18px;
    }

    .bar {
      height: 12px;
      background: var(--soft);
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid rgba(222,216,202,0.7);
    }

    .bar > div {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      transition: width 0.25s ease;
    }

    .score {
      font-weight: 800;
      color: var(--accent);
      white-space: nowrap;
    }

    .questionCard {
      display: grid;
      gap: 16px;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border-radius: 999px;
      background: var(--soft);
      color: #4b4a43;
      padding: 6px 10px;
      font-size: 0.82rem;
      font-weight: 700;
    }

    .box {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 16px;
    }

    .label {
      color: var(--muted);
      font-size: 0.86rem;
      font-weight: 800;
      margin-bottom: 8px;
      letter-spacing: 0.08em;
    }

    .sentence {
      font-size: clamp(1.02rem, 2.4vw, 1.35rem);
      line-height: 1.65;
    }

    .dropzone, .wordbank {
      min-height: 76px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: flex-start;
      padding: 12px;
      border-radius: 18px;
      border: 2px dashed #c9bfaa;
      background: rgba(255,250,242,0.7);
    }

    .dropzone {
      background: rgba(239,245,236,0.82);
    }

    .chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 9px 13px;
      border-radius: 14px;
      border: 1px solid #d8ceb9;
      background: var(--chip);
      box-shadow: 0 4px 10px rgba(51,45,33,0.06);
      font-weight: 750;
      cursor: grab;
      user-select: none;
      touch-action: none;
      transition: transform 0.12s ease, opacity 0.12s ease, background 0.12s ease;
    }

    .chip:active { cursor: grabbing; }
    .chip.dragging { opacity: 0.45; transform: scale(0.97); }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .feedback {
      min-height: 34px;
      font-weight: 800;
      line-height: 1.6;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    .feedback.ok { color: var(--ok); }
    .feedback.bad { color: var(--bad); }
    .feedback.neutral { color: var(--muted); }

    .explanation {
      display: none;
      background: #fbfaf6;
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 14px 16px;
      line-height: 1.7;
    }

    .explanation.show { display: block; }

    .answerLine {
      margin-top: 8px;
      font-weight: 800;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .speakBtn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      min-height: 34px;
      padding: 0;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--accent);
      cursor: pointer;
      font-size: 1rem;
      transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease;
      flex-shrink: 0;
    }

    .speakBtn:hover {
      background: var(--soft);
      transform: translateY(-1px);
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .speakBtn.speaking {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .promptRow {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .promptRow .sentence {
      flex: 1;
    }

    .smallNote {
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.65;
    }

    @media (max-width: 760px) {
      .toolbar {
        grid-template-columns: 1fr 1fr;
      }
      .toolbar .selectWrap {
        grid-column: 1 / -1;
      }
      button { padding: 0 12px; }
      .panel { padding: 14px; border-radius: 18px; }
      .chip { min-height: 40px; padding: 8px 11px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>英語倒置法ドラッグ練習 100問</h1>
    <p class="subtitle">普通の文を見て、語句カードを並べ替え、倒置文を作ります。否定語・Only・So/Neither・仮定法if省略・場所表現の倒置をまとめて練習できます。</p>
  </header>

  <main class="panel">
    <div class="toolbar">
      <div class="selectWrap">
        <select id="categorySelect" aria-label="カテゴリ選択">
          <option value="all">全カテゴリ</option>
          <option value="negative">否定語・準否定語</option>
          <option value="notonly">Not only ... but also</option>
          <option value="only">Only + 副詞句・節</option>
          <option value="soNeither">So / Neither / Nor</option>
          <option value="conditional">仮定法 if省略</option>
          <option value="place">場所・方向の倒置</option>
        </select>
      </div>
      <button id="prevBtn">前へ</button>
      <button id="nextBtn">次へ</button>
      <button id="shuffleBtn" class="warn">出題順シャッフル</button>
    </div>

    <div class="progressRow">
      <div class="bar"><div id="barFill"></div></div>
      <div class="score" id="scoreText">0 / 100 正解</div>
    </div>

    <section class="questionCard">
      <div class="meta">
        <span class="badge" id="qNum">Q1</span>
        <span class="badge" id="categoryBadge">カテゴリ</span>
        <span class="badge" id="levelBadge">Level</span>
      </div>

      <div class="box">
        <div class="label">普通の文・意味</div>
        <div class="promptRow">
          <div class="sentence" id="promptSentence"></div>
          <button class="speakBtn" id="speakPromptBtn" title="問題文を読み上げる">🔊</button>
        </div>
      </div>

      <div class="box">
        <div class="label">ここに倒置文を作る</div>
        <div id="dropzone" class="dropzone" aria-label="解答欄"></div>
      </div>

      <div class="box">
        <div class="label">語句カード</div>
        <div id="wordbank" class="wordbank" aria-label="語句カード置き場"></div>
      </div>

      <div class="controls">
        <button id="checkBtn" class="primary">判定</button>
        <button id="hintBtn">ヒント</button>
        <button id="resetBtn">やり直し</button>
        <button id="showBtn">答えを見る</button>
      </div>

      <div id="feedback" class="feedback neutral">カードをドラッグして倒置文を作ってください。</div>

      <div id="explanation" class="explanation"></div>

      <p class="smallNote">スマホ・タブレットではカードを長押し気味にして動かすと並べ替えやすいです。カードをタップすると、語句カード置き場と解答欄の間を移動できます。</p>
    </section>
  </main>

  <script>
    const baseQuestions = [
      {cat:'negative', level:'基本', normal:'I have never seen such a beautiful sunset.', answer:'Never have I seen such a beautiful sunset.', hint:'Never が文頭に出るので have I seen の語順。', exp:'否定語 Never が文頭に来ると部分倒置になります。have + 主語 + 過去分詞です。'},
      {cat:'negative', level:'基本', normal:'She rarely eats breakfast before seven.', answer:'Rarely does she eat breakfast before seven.', hint:'一般動詞なので does を使います。', exp:'Rarely は準否定語です。現在・三人称単数の一般動詞なので does she eat になります。'},
      {cat:'negative', level:'基本', normal:'He seldom speaks in public.', answer:'Seldom does he speak in public.', hint:'Seldom + does + 主語 + 動詞原形。', exp:'Seldom が文頭なので部分倒置。speaks は does を前に出すため speak に戻ります。'},
      {cat:'negative', level:'基本', normal:'I little knew what would happen next.', answer:'Little did I know what would happen next.', hint:'Little did I know は定型表現です。', exp:'Little が「ほとんど〜ない」の意味で文頭に来ると倒置します。'},
      {cat:'negative', level:'基本', normal:'He had hardly arrived when it began to rain.', answer:'Hardly had he arrived when it began to rain.', hint:'Hardly had S p.p. when ... の形。', exp:'Hardly が文頭に出ると had he arrived と倒置します。'},
      {cat:'negative', level:'基本', normal:'She had scarcely opened the door when the phone rang.', answer:'Scarcely had she opened the door when the phone rang.', hint:'Scarcely had S p.p. when ...。', exp:'Scarcely は Hardly と同じく文頭で部分倒置を起こします。'},
      {cat:'negative', level:'基本', normal:'I have never heard such a strange story.', answer:'Never have I heard such a strange story.', hint:'Never + have + S + p.p.。', exp:'現在完了の倒置では have/has が主語の前に出ます。'},
      {cat:'negative', level:'基本', normal:'We rarely see snow in this town.', answer:'Rarely do we see snow in this town.', hint:'一般動詞なので do を補います。', exp:'Rarely が文頭なので do we see になります。'},
      {cat:'negative', level:'基本', normal:'He had no sooner sat down than the alarm rang.', answer:'No sooner had he sat down than the alarm rang.', hint:'No sooner had S p.p. than ...。', exp:'No sooner が文頭に出ると had he sat down と倒置します。'},
      {cat:'negative', level:'標準', normal:'You should under no circumstances open this door.', answer:'Under no circumstances should you open this door.', hint:'Under no circumstances + should + S + V。', exp:'強い否定表現 under no circumstances が文頭に来るため部分倒置です。'},
      {cat:'negative', level:'標準', normal:'I realized the danger only after the accident.', answer:'Only after the accident did I realize the danger.', hint:'Only + 副詞句が文頭なので did I realize。', exp:'Only after ... は文全体を制限する副詞句なので倒置します。'},
      {cat:'negative', level:'標準', normal:'He was at no time aware of the risk.', answer:'At no time was he aware of the risk.', hint:'be動詞なので was he。', exp:'At no time は「一度も〜ない」。文頭で was he と倒置します。'},
      {cat:'negative', level:'標準', normal:'The truth was nowhere to be found.', answer:'Nowhere was the truth to be found.', hint:'Nowhere + be + S。', exp:'Nowhere が否定的な場所表現として文頭に来ると倒置します。'},
      {cat:'negative', level:'標準', normal:'I did not understand the problem until later.', answer:'Not until later did I understand the problem.', hint:'Not until later + did + S + V。', exp:'Not until ... が文頭に出ると主節が倒置します。'},
      {cat:'negative', level:'標準', normal:'He could not solve the problem in any way.', answer:'In no way could he solve the problem.', hint:'In no way + could + S + V。', exp:'In no way は「決して〜ない」。文頭で助動詞 could が前に出ます。'},
      {cat:'negative', level:'標準', normal:'The team has never faced such pressure before.', answer:'Never before has the team faced such pressure.', hint:'Never before + has + S + p.p.。', exp:'Never before が文頭に出ると現在完了の has が主語の前に出ます。'},
      {cat:'negative', level:'標準', normal:'He did not say a word during the meeting.', answer:'Not a word did he say during the meeting.', hint:'Not a word + did + S + V。', exp:'Not a word が否定表現として文頭に来るため倒置します。'},
      {cat:'negative', level:'標準', normal:'She had never felt so alone.', answer:'Never had she felt so alone.', hint:'過去完了なので had she felt。', exp:'Never が文頭、過去完了なので had が前に出ます。'},
      {cat:'negative', level:'標準', normal:'I have rarely been so surprised.', answer:'Rarely have I been so surprised.', hint:'現在完了なので have I been。', exp:'Rarely が文頭に出ると、助動詞 have が主語の前に出ます。'},
      {cat:'negative', level:'応用', normal:'He did not realize how serious the mistake was until the next morning.', answer:'Not until the next morning did he realize how serious the mistake was.', hint:'Not until ... did he realize ...。', exp:'Not until の後ろは普通語順で、主節だけ did he realize と倒置します。'},

      {cat:'notonly', level:'基本', normal:'She is not only smart but also kind.', answer:'Not only is she smart, but she is also kind.', hint:'be動詞なので is she。but側は普通語順。', exp:'Not only を文頭に出すと not only 側だけ倒置します。'},
      {cat:'notonly', level:'基本', normal:'He can not only sing but also dance.', answer:'Not only can he sing, but he can also dance.', hint:'can he sing。but側は he can also dance。', exp:'助動詞 can があるので can he sing と倒置します。'},
      {cat:'notonly', level:'基本', normal:'She not only passed the exam but also won a prize.', answer:'Not only did she pass the exam, but she also won a prize.', hint:'一般動詞なので did she pass。', exp:'過去の一般動詞 passed は did を前に出し、pass に戻します。'},
      {cat:'notonly', level:'基本', normal:'He not only helped me but also encouraged me.', answer:'Not only did he help me, but he also encouraged me.', hint:'did he help。', exp:'not only 側だけ部分倒置。but also 側は普通語順です。'},
      {cat:'notonly', level:'基本', normal:'They not only repaired the car but also washed it.', answer:'Not only did they repair the car, but they also washed it.', hint:'did they repair。', exp:'過去形 repaired は did they repair になります。'},
      {cat:'notonly', level:'標準', normal:'The book is not only interesting but also useful.', answer:'Not only is the book interesting, but it is also useful.', hint:'is the book interesting。', exp:'be動詞がある文では be動詞を主語の前に置きます。'},
      {cat:'notonly', level:'標準', normal:'The plan will not only save time but also reduce costs.', answer:'Not only will the plan save time, but it will also reduce costs.', hint:'will the plan save。', exp:'助動詞 will が前に出ます。but側は普通語順です。'},
      {cat:'notonly', level:'標準', normal:'She has not only finished the report but also sent it.', answer:'Not only has she finished the report, but she has also sent it.', hint:'has she finished。', exp:'現在完了では has が主語の前に出ます。'},
      {cat:'notonly', level:'標準', normal:'He not only forgot my name but also forgot my birthday.', answer:'Not only did he forget my name, but he also forgot my birthday.', hint:'did he forget。', exp:'forgot は did を前に出して forget に戻します。'},
      {cat:'notonly', level:'標準', normal:'This method not only works well but also saves energy.', answer:'Not only does this method work well, but it also saves energy.', hint:'does this method work。', exp:'現在・三人称単数なので does this method work になります。'},
      {cat:'notonly', level:'標準', normal:'The movie not only entertained us but also made us think.', answer:'Not only did the movie entertain us, but it also made us think.', hint:'did the movie entertain。', exp:'一般動詞の過去形なので did を使った部分倒置です。'},
      {cat:'notonly', level:'標準', normal:'She not only speaks French but also writes it beautifully.', answer:'Not only does she speak French, but she also writes it beautifully.', hint:'does she speak。', exp:'speaks は does を前に出すため speak に戻ります。'},
      {cat:'notonly', level:'応用', normal:'The discovery not only changed science but also influenced philosophy.', answer:'Not only did the discovery change science, but it also influenced philosophy.', hint:'did the discovery change。', exp:'Not only 文頭では not only 側だけ倒置。後半の it also influenced は普通語順です。'},
      {cat:'notonly', level:'応用', normal:'He not only admitted his mistake but also apologized sincerely.', answer:'Not only did he admit his mistake, but he also apologized sincerely.', hint:'did he admit。', exp:'過去形 admitted は did he admit になります。'},
      {cat:'notonly', level:'応用', normal:'The teacher not only explained the rule but also gave many examples.', answer:'Not only did the teacher explain the rule, but she also gave many examples.', hint:'did the teacher explain。', exp:'but側まで倒置しないのが重要です。'},

      {cat:'only', level:'基本', normal:'I understood the answer only then.', answer:'Only then did I understand the answer.', hint:'Only then + did + S + V。', exp:'Only + 副詞が文頭に出ると主節が倒置します。'},
      {cat:'only', level:'基本', normal:'She noticed the mistake only later.', answer:'Only later did she notice the mistake.', hint:'did she notice。', exp:'Only later が文頭なので did she notice になります。'},
      {cat:'only', level:'基本', normal:'We can solve the problem only in this way.', answer:'Only in this way can we solve the problem.', hint:'can we solve。', exp:'Only + 副詞句が文頭にあるため助動詞 can が前に出ます。'},
      {cat:'only', level:'基本', normal:'He realized the truth only after the meeting.', answer:'Only after the meeting did he realize the truth.', hint:'did he realize。', exp:'Only after ... は副詞句なので倒置します。'},
      {cat:'only', level:'標準', normal:'I began to relax only when I got home.', answer:'Only when I got home did I begin to relax.', hint:'Only when節の後、主節が倒置。', exp:'Only when I got home は普通語順。倒置するのは主節 did I begin です。'},
      {cat:'only', level:'標準', normal:'She understood his feelings only after she read the letter.', answer:'Only after she read the letter did she understand his feelings.', hint:'Only after節の後、did she understand。', exp:'Only + 節が文頭に出ると、後ろの主節で部分倒置します。'},
      {cat:'only', level:'標準', normal:'You will succeed only if you keep practicing.', answer:'Only if you keep practicing will you succeed.', hint:'Only if節の後、will you succeed。', exp:'Only if の節内は倒置しません。主節だけ will you succeed です。'},
      {cat:'only', level:'標準', normal:'He found the key only by looking carefully.', answer:'Only by looking carefully did he find the key.', hint:'Only by ... did he find。', exp:'Only by doing は「〜することによってのみ」。主節が倒置します。'},
      {cat:'only', level:'標準', normal:'We understood the scale of the problem only after the data was published.', answer:'Only after the data was published did we understand the scale of the problem.', hint:'Only after節 + did we understand。', exp:'Only after の節内は普通語順、主節が倒置です。'},
      {cat:'only', level:'標準', normal:'She can enter the room only with a special card.', answer:'Only with a special card can she enter the room.', hint:'can she enter。', exp:'Only + 前置詞句が文頭なので助動詞 can が主語の前に出ます。'},
      {cat:'only', level:'応用', normal:'The importance of sleep became clear only recently.', answer:'Only recently did the importance of sleep become clear.', hint:'did the importance become。', exp:'became は did を使うので become に戻ります。'},
      {cat:'only', level:'応用', normal:'I realized how difficult the task was only after I tried it myself.', answer:'Only after I tried it myself did I realize how difficult the task was.', hint:'Only after節 + did I realize。', exp:'Only after 節が文頭。主節の I realized が did I realize になります。'},
      {cat:'only', level:'応用', normal:'The door opens only when both buttons are pressed.', answer:'Only when both buttons are pressed does the door open.', hint:'does the door open。', exp:'現在・三人称単数なので does the door open です。'},
      {cat:'only', level:'応用', normal:'You can understand the mechanism only by building it yourself.', answer:'Only by building it yourself can you understand the mechanism.', hint:'can you understand。', exp:'Only by ... が文頭にあるため can が主語の前に出ます。'},
      {cat:'only', level:'応用', normal:'The error appears only under very specific conditions.', answer:'Only under very specific conditions does the error appear.', hint:'does the error appear。', exp:'Only + 前置詞句の倒置。一般動詞の現在形なので does を使います。'},

      {cat:'soNeither', level:'基本', normal:'I like tea. My sister likes tea too.', answer:'I like tea, and so does my sister.', hint:'肯定の同意は so + 助動詞 + 主語。', exp:'前文が一般動詞現在なので does を使います。'},
      {cat:'soNeither', level:'基本', normal:'He can swim. I can swim too.', answer:'He can swim, and so can I.', hint:'so can I。', exp:'助動詞 can をそのまま使って so can I になります。'},
      {cat:'soNeither', level:'基本', normal:'She is tired. I am tired too.', answer:'She is tired, and so am I.', hint:'be動詞なら so am I。', exp:'be動詞の同意表現では be動詞が主語の前に出ます。'},
      {cat:'soNeither', level:'基本', normal:'I do not like coffee. He does not like coffee either.', answer:'I do not like coffee, and neither does he.', hint:'否定の同意は neither + 助動詞 + 主語。', exp:'前文が do not like なので neither does he です。'},
      {cat:'soNeither', level:'基本', normal:'She cannot drive. I cannot drive either.', answer:'She cannot drive, and neither can I.', hint:'neither can I。', exp:'否定文への同意は neither can I になります。'},

      {cat:'soNeither', level:'標準', normal:'They have never visited Kyoto. I have never visited Kyoto either.', answer:'They have never visited Kyoto, and neither have I.', hint:'neither have I。', exp:'前文が否定内容なので neither have I になります。'},
      {cat:'soNeither', level:'標準', normal:'My brother likes this movie. My parents like it too.', answer:'My brother likes this movie, and so do my parents.', hint:'主語が複数なので do。', exp:'前文は likes ですが、後ろの主語 my parents は複数なので so do my parents です。'},
      {cat:'soNeither', level:'応用', normal:'I had never felt such fear. She had never felt it either.', answer:'I had never felt such fear, and neither had she.', hint:'過去完了なので neither had she。', exp:'過去完了の否定への同意は neither had she です。'},
      {cat:'soNeither', level:'応用', normal:'The device works well. The new model works well too.', answer:'The device works well, and so does the new model.', hint:'三人称単数なので does。', exp:'後ろの主語 the new model に合わせて does を使います。'},
      {cat:'soNeither', level:'応用', normal:'I should apologize. He should apologize too.', answer:'I should apologize, and so should he.', hint:'so should he。', exp:'助動詞 should をそのまま使います。'},
      {cat:'soNeither', level:'応用', normal:'She is not ready. We are not ready either.', answer:'She is not ready, and neither are we.', hint:'neither are we。', exp:'be動詞の否定への同意なので neither are we です。'},

      {cat:'conditional', level:'基本', normal:'If I were you, I would accept the offer.', answer:'Were I you, I would accept the offer.', hint:'If I were → Were I。', exp:'仮定法で if を省略すると were が主語の前に出ます。'},
      {cat:'conditional', level:'基本', normal:'If he had known the truth, he would have acted differently.', answer:'Had he known the truth, he would have acted differently.', hint:'If he had known → Had he known。', exp:'過去完了の仮定法で if を省略すると had が前に出ます。'},
      {cat:'conditional', level:'基本', normal:'If you should need help, call me.', answer:'Should you need help, call me.', hint:'If you should → Should you。', exp:'should を含む条件文では if 省略で Should you ... になります。'},
      {cat:'conditional', level:'基本', normal:'If she were here, she could explain it.', answer:'Were she here, she could explain it.', hint:'Were she here。', exp:'If she were の if を省略し、were を前に出します。'},
      {cat:'conditional', level:'標準', normal:'If they had left earlier, they would have caught the train.', answer:'Had they left earlier, they would have caught the train.', hint:'Had they left earlier。', exp:'仮定法過去完了の if 省略です。'},
      {cat:'conditional', level:'標準', normal:'If the weather were better, we could go hiking.', answer:'Were the weather better, we could go hiking.', hint:'Were the weather better。', exp:'If the weather were を Were the weather にします。'},
      {cat:'conditional', level:'標準', normal:'If you should change your mind, let me know.', answer:'Should you change your mind, let me know.', hint:'Should you change your mind。', exp:'可能性の低い条件を表す should の if 省略です。'},
      {cat:'conditional', level:'標準', normal:'If I had had more time, I would have checked it again.', answer:'Had I had more time, I would have checked it again.', hint:'Had I had more time。', exp:'had が2つ続きます。最初の Had が倒置された助動詞です。'},
      {cat:'conditional', level:'標準', normal:'If it were not for your help, I would fail.', answer:'Were it not for your help, I would fail.', hint:'Were it not for ...。', exp:'If it were not for は Were it not for とできます。'},
      {cat:'conditional', level:'標準', normal:'If it had not been for the map, we would have been lost.', answer:'Had it not been for the map, we would have been lost.', hint:'Had it not been for ...。', exp:'If it had not been for は Had it not been for とできます。'},
      {cat:'conditional', level:'応用', normal:'If the machine should stop, press this button.', answer:'Should the machine stop, press this button.', hint:'Should the machine stop。', exp:'should 条件文の if 省略。主語 the machine の前に Should を置きます。'},
      {cat:'conditional', level:'応用', normal:'If I were to choose again, I would choose the same path.', answer:'Were I to choose again, I would choose the same path.', hint:'Were I to choose。', exp:'If I were to ... は Were I to ... にできます。'},
      {cat:'conditional', level:'応用', normal:'If he had listened carefully, he would not have made the mistake.', answer:'Had he listened carefully, he would not have made the mistake.', hint:'Had he listened carefully。', exp:'if 省略により had が主語 he の前に出ます。'},
      {cat:'conditional', level:'応用', normal:'If the results were different, our conclusion would change.', answer:'Were the results different, our conclusion would change.', hint:'Were the results different。', exp:'仮定法過去の if 省略では were が文頭に出ます。'},
      {cat:'conditional', level:'応用', normal:'If you should have any questions, please contact us.', answer:'Should you have any questions, please contact us.', hint:'Should you have any questions。', exp:'丁寧な案内文でよく使われる if 省略の倒置です。'},

      {cat:'place', level:'基本', normal:'The bus comes here.', answer:'Here comes the bus.', hint:'Here + 動詞 + 名詞主語。', exp:'場所・方向の副詞が文頭に出て、主語が名詞の場合は全部倒置が起こります。'},
      {cat:'place', level:'基本', normal:'The train goes there.', answer:'There goes the train.', hint:'There goes + 名詞主語。', exp:'There goes the train は定型的な全部倒置です。'},
      {cat:'place', level:'基本', normal:'A cat sat under the table.', answer:'Under the table sat a cat.', hint:'場所句 + 動詞 + 主語。', exp:'場所を表す前置詞句が文頭に出ると、文学的に全部倒置が使われます。'},
      {cat:'place', level:'基本', normal:'A small house stood on the hill.', answer:'On the hill stood a small house.', hint:'On the hill stood ...。', exp:'場所句 On the hill を文頭に出し、stood が主語の前に来ます。'},
      {cat:'place', level:'標準', normal:'An old temple lies beyond the river.', answer:'Beyond the river lies an old temple.', hint:'Beyond the river lies ...。', exp:'場所句 + 自動詞 + 名詞主語の全部倒置です。'},
      {cat:'place', level:'標準', normal:'A beautiful garden was behind the house.', answer:'Behind the house was a beautiful garden.', hint:'Behind the house was ...。', exp:'be動詞でも場所句文頭の全部倒置が起こります。'},
      {cat:'place', level:'標準', normal:'A tiny village lay in the valley.', answer:'In the valley lay a tiny village.', hint:'In the valley lay ...。', exp:'場所句を文頭に出すと lay が主語の前に来ます。'},
      {cat:'place', level:'標準', normal:'The children ran out.', answer:'Out ran the children.', hint:'Out ran + 名詞主語。', exp:'方向の副詞 Out が文頭、主語が名詞なので全部倒置できます。'},
      {cat:'place', level:'標準', normal:'The dog jumped up.', answer:'Up jumped the dog.', hint:'Up jumped the dog。', exp:'方向副詞 Up が文頭に出る表現です。'},
      {cat:'place', level:'標準', normal:'A bright star appeared in the sky.', answer:'In the sky appeared a bright star.', hint:'In the sky appeared ...。', exp:'場所句が文頭に出て appeared が主語の前に出ます。'},
      {cat:'place', level:'応用', normal:'A strange figure stood at the entrance.', answer:'At the entrance stood a strange figure.', hint:'At the entrance stood ...。', exp:'情景描写でよく使う場所句文頭の全部倒置です。'},
      {cat:'place', level:'応用', normal:'A large painting hung above the fireplace.', answer:'Above the fireplace hung a large painting.', hint:'Above the fireplace hung ...。', exp:'場所句 + 動詞 + 名詞主語の形です。'},
      {cat:'place', level:'応用', normal:'Three important documents were on the desk.', answer:'On the desk were three important documents.', hint:'On the desk were ...。', exp:'主語が複数なので be動詞は were です。'},
      {cat:'place', level:'応用', normal:'The old castle stands at the top of the mountain.', answer:'At the top of the mountain stands the old castle.', hint:'At the top ... stands ...。', exp:'場所句文頭で stands が主語の前に出ます。'},
      {cat:'place', level:'応用', normal:'A new problem emerged from the discussion.', answer:'From the discussion emerged a new problem.', hint:'From the discussion emerged ...。', exp:'From ... も場所・起点の句として文頭に置かれ、全部倒置が可能です。'}
    ];

    const categoryNames = {
      negative: '否定語・準否定語',
      notonly: 'Not only ... but also',
      only: 'Only + 副詞句・節',
      soNeither: 'So / Neither / Nor',
      conditional: '仮定法 if省略',
      place: '場所・方向の倒置'
    };

    let questions = [...baseQuestions];
    let filtered = [...questions];
    let current = 0;
    let solved = new Set();
    let chipId = 0;

    const els = {
      categorySelect: document.getElementById('categorySelect'),
      prevBtn: document.getElementById('prevBtn'),
      nextBtn: document.getElementById('nextBtn'),
      shuffleBtn: document.getElementById('shuffleBtn'),
      barFill: document.getElementById('barFill'),
      scoreText: document.getElementById('scoreText'),
      qNum: document.getElementById('qNum'),
      categoryBadge: document.getElementById('categoryBadge'),
      levelBadge: document.getElementById('levelBadge'),
      promptSentence: document.getElementById('promptSentence'),
      dropzone: document.getElementById('dropzone'),
      wordbank: document.getElementById('wordbank'),
      checkBtn: document.getElementById('checkBtn'),
      hintBtn: document.getElementById('hintBtn'),
      resetBtn: document.getElementById('resetBtn'),
      showBtn: document.getElementById('showBtn'),
      feedback: document.getElementById('feedback'),
      explanation: document.getElementById('explanation'),
      speakPromptBtn: document.getElementById('speakPromptBtn')
    };

    // ---- Speech synthesis ----
    let currentUtterance = null;

    function speak(text, btn) {
      if (!window.speechSynthesis) return;
      window.speechSynthesis.cancel();
      if (currentUtterance && btn && btn.classList.contains('speaking')) {
        btn.classList.remove('speaking');
        currentUtterance = null;
        return;
      }
      // Reset all speak buttons
      document.querySelectorAll('.speakBtn').forEach(b => b.classList.remove('speaking'));
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'en-US';
      utter.rate = 0.92;
      if (btn) btn.classList.add('speaking');
      utter.onend = () => { if (btn) btn.classList.remove('speaking'); currentUtterance = null; };
      utter.onerror = () => { if (btn) btn.classList.remove('speaking'); currentUtterance = null; };
      currentUtterance = utter;
      window.speechSynthesis.speak(utter);
    }

    // ---- Chip normalization ----
    // Split "word," → ["word", ","]  and  "word." → ["word", "."]
    // Also lowercase the display text (answer comparison uses the original answer string)
    function tokenize(sentence) {
      const raw = sentence.match(/[^\s]+/g) || [];
      const tokens = [];
      for (const t of raw) {
        // Separate trailing punctuation: commas, periods, exclamation, question, semicolon, colon
        const m = t.match(/^(.*?)([,\.!?;:]+)$/);
        if (m && m[1]) {
          tokens.push(m[1]);   // word without punctuation
          tokens.push(m[2]);   // punctuation as separate token
        } else {
          tokens.push(t);
        }
      }
      return tokens;
    }

    // Display text on chip: lowercase first letter (sentence-start capitals → lowercase)
    // Punctuation chips are kept as-is
    function chipDisplayText(token) {
      if (/^[,\.!?;:]+$/.test(token)) return token; // pure punctuation
      // Lowercase only if the token is ALL-caps-first and not an acronym (heuristic: length > 1 or all caps)
      return token.charAt(0).toLowerCase() + token.slice(1);
    }

    // Build the "answer" string from chip display texts for comparison
    // We reconstruct by joining with spaces but attach punctuation tokens to previous word
    function reconstructAnswer(chips) {
      const texts = chips.map(el => el.dataset.display);
      const parts = [];
      for (let i = 0; i < texts.length; i++) {
        if (/^[,\.!?;:]+$/.test(texts[i]) && parts.length > 0) {
          parts[parts.length - 1] += texts[i];
        } else {
          parts.push(texts[i]);
        }
      }
      return parts.join(' ');
    }

    function normalizeText(text) {
      return text.replace(/\s+([,.!?;:])/g, '$1').replace(/\s+/g, ' ').trim();
    }

    function shuffle(array) {
      const a = [...array];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function makeChip(token) {
      const display = chipDisplayText(token);
      const div = document.createElement('div');
      div.className = 'chip';
      div.textContent = display;
      div.dataset.display = display;
      div.dataset.id = String(chipId++);
      div.draggable = true;
      div.addEventListener('dragstart', e => {
        div.classList.add('dragging');
        e.dataTransfer.setData('text/plain', div.dataset.id);
        e.dataTransfer.effectAllowed = 'move';
      });
      div.addEventListener('dragend', () => div.classList.remove('dragging'));
      div.addEventListener('click', () => {
        if (div.parentElement === els.wordbank) els.dropzone.appendChild(div);
        else els.wordbank.appendChild(div);
        clearFeedback();
      });
      return div;
    }

    function setupDnD(container) {
      container.addEventListener('dragover', e => {
        e.preventDefault();
        const dragging = document.querySelector('.dragging');
        if (!dragging) return;
        const after = getDragAfterElement(container, e.clientX, e.clientY);
        if (after == null) container.appendChild(dragging);
        else container.insertBefore(dragging, after);
      });
      container.addEventListener('drop', e => {
        e.preventDefault();
        clearFeedback();
      });
    }

    function getDragAfterElement(container, x, y) {
      const chips = [...container.querySelectorAll('.chip:not(.dragging)')];
      let closest = { offset: Number.NEGATIVE_INFINITY, element: null };
      for (const child of chips) {
        const box = child.getBoundingClientRect();
        const offsetY = y - box.top - box.height / 2;
        const offsetX = x - box.left - box.width / 2;
        const sameRow = Math.abs(offsetY) < box.height * 0.9;
        const offset = sameRow ? -Math.abs(offsetY) * 1000 + offsetX : -Math.abs(offsetY) * 1000;
        if (offset < 0 && offset > closest.offset) closest = { offset, element: child };
      }
      return closest.element;
    }

    function render() {
      if (!filtered.length) return;
      // Stop any ongoing speech
      if (window.speechSynthesis) window.speechSynthesis.cancel();
      document.querySelectorAll('.speakBtn').forEach(b => b.classList.remove('speaking'));
      const q = filtered[current];
      els.qNum.textContent = `Q${current + 1} / ${filtered.length}`;
      els.categoryBadge.textContent = categoryNames[q.cat];
      els.levelBadge.textContent = q.level;
      els.promptSentence.textContent = q.normal;
      els.dropzone.innerHTML = '';
      els.wordbank.innerHTML = '';
      els.explanation.classList.remove('show');
      els.explanation.innerHTML = '';
      setFeedback('カードをドラッグして倒置文を作ってください。', 'neutral');
      chipId = 0;
      const words = shuffle(tokenize(q.answer));
      for (const word of words) els.wordbank.appendChild(makeChip(word));
      updateProgress();
    }

    function userAnswer() {
      const chips = [...els.dropzone.querySelectorAll('.chip')];
      return reconstructAnswer(chips);
    }

    function currentAnswer() {
      // Normalize the answer the same way chips are normalized for comparison
      const tokens = tokenize(filtered[current].answer);
      const normalized = tokens.map(t => chipDisplayText(t));
      const parts = [];
      for (let i = 0; i < normalized.length; i++) {
        if (/^[,\.!?;:]+$/.test(normalized[i]) && parts.length > 0) {
          parts[parts.length - 1] += normalized[i];
        } else {
          parts.push(normalized[i]);
        }
      }
      return parts.join(' ');
    }

    function checkAnswer() {
      const user = userAnswer();
      if (!user) {
        setFeedback('まだ解答欄が空です。カードを上に移動してみましょう。', 'bad');
        return;
      }
      if (user === currentAnswer()) {
        const globalIndex = questions.indexOf(filtered[current]);
        solved.add(globalIndex);
        const answerText = filtered[current].answer;
        setFeedbackWithSpeak('正解です！この語順、かなり大事です。', 'ok', answerText);
        showExplanation(false);
        updateProgress();
      } else {
        setFeedback('惜しいです。助動詞・be動詞の位置と、but側を倒置していないか確認してください。', 'bad');
      }
    }

    function showExplanation(includeAnswer = true) {
      const q = filtered[current];
      els.explanation.innerHTML = `
        <div><strong>ポイント：</strong>${q.exp}</div>
        <div class="answerLine">答え：${q.answer} <button class="speakBtn" onclick="speak('${q.answer.replace(/'/g,"\\'")}', this)" title="正解文を読み上げる">🔊</button></div>
      `;
      els.explanation.classList.add('show');
    }

    function showHint() {
      const q = filtered[current];
      setFeedback(`ヒント：${q.hint}`, 'neutral');
    }

    function showAnswer() {
      const q = filtered[current];
      els.dropzone.innerHTML = '';
      els.wordbank.innerHTML = '';
      for (const word of tokenize(q.answer)) els.dropzone.appendChild(makeChip(word));
      setFeedback('答えを表示しました。語順を声に出して読むと定着しやすいです。', 'neutral');
      showExplanation(true);
    }

    function resetQuestion() {
      render();
    }

    function setFeedback(text, type) {
      els.feedback.textContent = text;
      els.feedback.className = `feedback ${type}`;
    }

    function setFeedbackWithSpeak(text, type, speakText) {
      els.feedback.className = `feedback ${type}`;
      els.feedback.innerHTML = '';
      const span = document.createElement('span');
      span.textContent = text + '　';
      els.feedback.appendChild(span);
      const btn = document.createElement('button');
      btn.className = 'speakBtn';
      btn.title = '正解文を読み上げる';
      btn.textContent = '🔊';
      btn.addEventListener('click', () => speak(speakText, btn));
      els.feedback.appendChild(btn);
    }

    function clearFeedback() {
      setFeedback('並べ替え中です。できたら「判定」を押してください。', 'neutral');
    }

    function updateProgress() {
      const total = questions.length;
      const percent = Math.round((solved.size / total) * 100);
      els.barFill.style.width = `${percent}%`;
      els.scoreText.textContent = `${solved.size} / ${total} 正解`;
    }

    function applyFilter() {
      const cat = els.categorySelect.value;
      filtered = cat === 'all' ? [...questions] : questions.filter(q => q.cat === cat);
      current = 0;
      render();
    }

    function go(delta) {
      current = (current + delta + filtered.length) % filtered.length;
      render();
    }

    function shuffleOrder() {
      questions = shuffle(questions);
      applyFilter();
      setFeedback('出題順をシャッフルしました。', 'neutral');
    }

    els.checkBtn.addEventListener('click', checkAnswer);
    els.hintBtn.addEventListener('click', showHint);
    els.resetBtn.addEventListener('click', resetQuestion);
    els.showBtn.addEventListener('click', showAnswer);
    els.prevBtn.addEventListener('click', () => go(-1));
    els.nextBtn.addEventListener('click', () => go(1));
    els.shuffleBtn.addEventListener('click', shuffleOrder);
    els.categorySelect.addEventListener('change', applyFilter);
    els.speakPromptBtn.addEventListener('click', () => {
      speak(filtered[current].normal, els.speakPromptBtn);
    });

    setupDnD(els.dropzone);
    setupDnD(els.wordbank);

    render();
  </script>
</body>
</html>
